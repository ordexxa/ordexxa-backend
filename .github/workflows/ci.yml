name: Ordexxa Backend CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ordexxa_db
          POSTGRES_USER: ordexxa_user
          POSTGRES_PASSWORD: ordexxa_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U ordexxa_user -d ordexxa_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and test
        env:
          DB_URL: jdbc:postgresql://localhost:5433/ordexxa_db
          DB_USERNAME: ordexxa_user
          DB_PASSWORD: ordexxa_password
          REDIS_URL: redis://localhost:6379
          CACHE_TYPE: redis
          MAIL_HOST: localhost
          MAIL_PORT: 1025
          MAIL_SMTP_AUTH: false
          MAIL_SMTP_STARTTLS: false
        run: ./mvnw clean verify

      - name: SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=ordexxa_ordexxa-backend
          -Dsonar.organization=ordexxa
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=$SONAR_TOKEN
