spring.application.name=ordexxa-backend

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ordexxa_db}
spring.datasource.username=${DB_USERNAME:ordexxa_user}
spring.datasource.password=${DB_PASSWORD:ordexxa_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

spring.jackson.time-zone=America/Bogota

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

ordexxa.auth.verification-code-expiration-minutes=${AUTH_CODE_EXPIRATION_MINUTES:15}
ordexxa.auth.development-show-code-in-response=false
ordexxa.auth.show-verification-code-in-console=${AUTH_SHOW_CODE_IN_CONSOLE:false}

# Swagger / OpenAPI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=${SPRINGDOC_SHOW_ACTUATOR:true}

# Actuator / Monitoring
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS:always}
management.info.env.enabled=${ACTUATOR_INFO_ENV_ENABLED:true}
management.metrics.tags.application=ordexxa-backend

info.app.name=Ordexxa Backend
info.app.description=MVP funcional para registrar proveedor
info.app.version=0.0.1-SNAPSHOT

# Message Catalog / I18N
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}

spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:*}

ordexxa.mail.from=${MAIL_FROM:no-reply@ordexxa.local}

# CORS
ordexxa.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:4173}

# Cache / Redis
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=${REDIS_REPOSITORIES_ENABLED:false}
spring.cache.redis.time-to-live=${CACHE_TTL:30m}
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=${CACHE_KEY_PREFIX:ordexxa::}
management.health.redis.enabled=${ACTUATOR_REDIS_HEALTH_ENABLED:true}
ordexxa.cache.ttl=${CACHE_TTL:30m}

# Azure Key Vault / Vault de secretos
# Integración opcional: si AZURE_KEYVAULT_ENABLED=false, el backend funciona normalmente.
ordexxa.vault.enabled=${AZURE_KEYVAULT_ENABLED:false}
ordexxa.vault.endpoint=${AZURE_KEYVAULT_ENDPOINT:}
ordexxa.vault.tenant-id=${AZURE_TENANT_ID:}
ordexxa.vault.client-id=${AZURE_CLIENT_ID:}
ordexxa.vault.client-certificate-path=${AZURE_CLIENT_CERTIFICATE_PATH:}
ordexxa.vault.proof-secret-name=${AZURE_KEYVAULT_PROOF_SECRET_NAME:ordexxa-vault-proof}
ordexxa.vault.mail-password-secret-name=${MAIL_PASSWORD_SECRET_NAME:}
